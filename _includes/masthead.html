{% include base_path %}

<a class="skip-link" href="#main">Skip to content</a>

<header class="masthead" data-site-header>
  <div class="masthead__inner-wrap">
    <a class="site-brand" href="{{ base_path }}/" aria-label="{{ site.name | default: site.title }}">
      <span class="site-brand__mark">SM</span>
      <span class="site-brand__name">Sam</span>
    </a>

    <nav id="site-nav-links" class="site-nav" aria-label="Primary navigation" data-site-nav>
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
          {% assign domain = '' %}
        {% else %}
          {% assign domain = base_path %}
        {% endif %}
        <a class="site-nav__link" href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
      {% endfor %}
    </nav>

    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
      <span class="theme-toggle__sun" aria-hidden="true"></span>
      <span class="theme-toggle__moon" aria-hidden="true"></span>
    </button>
  </div>
</header>
